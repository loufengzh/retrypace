[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrypace"
version = "0.1.0"
description = "Deterministic deadline and pressure audits for retry schedules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["retry", "backoff", "simulation", "reliability"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
retrypace = "retrypace.cli:main"

[tool.setuptools.packages.find]
include = ["retrypace*"]
